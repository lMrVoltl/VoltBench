<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOLTAGE LAB — Графики</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <style>
    :root { --bg: #f4f6fa; --text: #0f172a; --sub: #64748b; --border: #e2e8f0; --voltage: #6366f1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
    body { background: #cbd5e1; color: var(--text); display: flex; justify-content: center; min-height: 100vh; margin: 0; }
    
    .app { width: 100%; max-width: 440px; background: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); }

    /* Шапка с кнопкой назад */
    .header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fff; z-index: 10; flex-shrink: 0; }
    .back-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; margin-right: 8px; color: #0f172a; text-decoration: none; }
    .back-btn:active { background: #f1f5f9; }
    .brand-wrap { display: flex; align-items: center; gap: 8px; flex: 1; }
    .brand-logo { width: 22px; height: 22px; background: #111827; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fbbf24; font-weight: 900; font-size: 13px; }
    .title { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
    .badge { font-size: 11px; font-weight: 700; background: #f0fdf4; color: #16a34a; padding: 4px 8px; border-radius: 6px; border: 1px solid #bbf7d0; }

    /* Область графика */
    .graph-viewport { position: relative; flex: 1; background: #fafafa; overflow: hidden; display: flex; flex-direction: column; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .graph-ctrls { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; background: rgba(255,255,255,0.92); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); z-index: 5; }
    .v-btn { padding: 10px; font-size: 16px; font-weight: 700; background: transparent; border: none; border-bottom: 1px solid var(--border); cursor: pointer; color: #334155; }
    .v-btn:last-child { border-bottom: none; font-size: 11px; padding: 8px 10px; }
    .v-btn:active { background: #e2e8f0; }

    /* Панель уравнений (многострочная) */
    .eq-panel { background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; max-height: 40vh; z-index: 10; }
    .eq-list { overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    
    .eq-item { display: flex; align-items: center; gap: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; transition: 0.2s; }
    .eq-item:focus-within { border-color: var(--voltage); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); background: #fff; }
    
    .eq-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
    .fn-label { font-size: 18px; font-weight: 700; color: var(--sub); font-style: italic; }
    .fn-input { flex: 1; border: none; background: transparent; font-size: 18px; font-weight: 600; color: var(--text); outline: none; width: 100%; }
    .btn-remove { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 18px; padding: 4px; border-radius: 6px; }
    .btn-remove:active { background: #fef2f2; color: #ef4444; }

    .panel-footer { padding: 10px 16px 20px; border-top: 1px solid #f1f5f9; background: #fff; }
    .btn-add { width: 100%; padding: 12px; border: 2px dashed #cbd5e1; background: transparent; color: var(--sub); font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .btn-add:active { background: #f1f5f9; border-color: #94a3b8; color: #475569; }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <a href="index.html" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brand-wrap">
      <div class="brand-logo">⚡</div>
      <div class="title">VOLTAGE LAB</div>
    </div>
    <div class="badge">ГРАФИКИ</div>
  </div>

  <div class="graph-viewport">
    <div class="graph-ctrls">
      <button class="v-btn" onclick="zoomGraph(0.8)">+</button>
      <button class="v-btn" onclick="zoomGraph(1.25)">-</button>
      <button class="v-btn" onclick="resetGraphView()">Сброс</button>
    </div>
    <canvas id="canvasGraph"></canvas>
  </div>
  
  <div class="eq-panel">
    <div class="eq-list" id="eqList">
      <!-- Графики добавляются сюда через JS -->
    </div>
    <div class="panel-footer">
      <button class="btn-add" onclick="addGraph()">+ Добавить функцию</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvasGraph');
  const ctx = canvas.getContext('2d');
  
  let offsetX = 0, offsetY = 0, scale = 50;
  let isDragging = false, lastX = 0, lastY = 0;

  // Система нескольких графиков
  const palette = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
  let equations = [
    { id: 1, expr: 'sin(x)', color: palette[0] },
    { id: 2, expr: 'x^2', color: palette[1] }
  ];
  let nextId = 3;

  function init() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.parentElement.clientWidth * dpr;
    canvas.height = canvas.parentElement.clientHeight * dpr;
    ctx.resetTransform(); ctx.scale(dpr, dpr);
    offsetX = (canvas.width / dpr) / 2; offsetY = (canvas.height / dpr) / 2;
    renderEqList();
    drawGraph();
  }

  // --- УПРАВЛЕНИЕ СПИСКОМ ФУНКЦИЙ ---
  function renderEqList() {
    const list = document.getElementById('eqList');
    list.innerHTML = '';
    equations.forEach((eq, index) => {
      const item = document.createElement('div');
      item.className = 'eq-item';
      item.innerHTML = `
        <div class="eq-color-dot" style="background: ${eq.color};"></div>
        <div class="fn-label">y =</div>
        <input type="text" class="fn-input" value="${eq.expr}" oninput="updateExpr(${eq.id}, this.value)" autocomplete="off" spellcheck="false">
        <button class="btn-remove" onclick="removeGraph(${eq.id})">✕</button>
      `;
      list.appendChild(item);
    });
  }

  function addGraph() {
    if (equations.length >= 6) return alert('Максимум 6 графиков');
    const color = palette[equations.length % palette.length];
    equations.push({ id: nextId++, expr: '', color: color });
    renderEqList();
  }

  function removeGraph(id) {
    equations = equations.filter(eq => eq.id !== id);
    renderEqList();
    drawGraph();
  }

  function updateExpr(id, val) {
    const eq = equations.find(e => e.id === id);
    if (eq) eq.expr = val;
    drawGraph();
  }

  // --- ОТРИСОВКА ---
  function resetGraphView() {
    const rect = canvas.getBoundingClientRect();
    offsetX = rect.width / 2; offsetY = rect.height / 2; scale = 50;
    drawGraph();
  }

  function zoomGraph(factor) {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    offsetX = cx - (cx - offsetX) / factor;
    offsetY = cy - (cy - offsetY) / factor;
    scale /= factor;
    drawGraph();
  }

  function drawGrid(w, h) {
    ctx.clearRect(0, 0, w, h);
    let step = scale > 100 ? 0.5 : (scale < 5 ? 10 : (scale < 20 ? 5 : 1));
    const pxStep = step * scale, sX = offsetX % pxStep, sY = offsetY % pxStep;

    ctx.lineWidth = 1; ctx.font = '10px sans-serif'; ctx.fillStyle = '#94a3b8';
    ctx.strokeStyle = '#e2e8f0'; ctx.beginPath();
    for (let x = sX; x < w; x += pxStep) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = sY; y < h; y += pxStep) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();

    ctx.strokeStyle = '#64748b'; ctx.beginPath();
    if (offsetY >= 0 && offsetY <= h) { ctx.moveTo(0, offsetY); ctx.lineTo(w, offsetY); }
    if (offsetX >= 0 && offsetX <= w) { ctx.moveTo(offsetX, 0); ctx.lineTo(offsetX, h); }
    ctx.stroke();

    for (let x = sX; x < w; x += pxStep) { const val = ((x - offsetX) / scale).toFixed(1).replace('.0', ''); if (val !== "0") ctx.fillText(val, x + 4, Math.min(Math.max(offsetY + 12, 12), h - 4)); }
    for (let y = sY; y < h; y += pxStep) { const val = (-(y - offsetY) / scale).toFixed(1).replace('.0', ''); if (val !== "0") ctx.fillText(val, Math.min(Math.max(offsetX + 4, 4), w - 20), y - 4); }
  }

  function drawGraph() {
    const w = canvas.getBoundingClientRect().width, h = canvas.getBoundingClientRect().height;
    drawGrid(w, h);
    
    // Рисуем каждый график из списка
    equations.forEach(eq => {
      if (!eq.expr.trim()) return;
      try {
        const compiled = math.compile(eq.expr);
        ctx.strokeStyle = eq.color;
        ctx.lineWidth = 2.5; 
        ctx.beginPath();
        let first = true;
        
        for (let px = 0; px < w; px += 2) {
          const mathX = (px - offsetX) / scale;
          const mathY = compiled.evaluate({ x: mathX });
          if (isNaN(mathY) || !isFinite(mathY)) { first = true; continue; }
          const py = offsetY - (mathY * scale);
          if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
        }
        ctx.stroke(); 
      } catch (e) { /* Игнорируем недописанные формулы */ }
    });
  }

  // Навигация по холсту
  canvas.addEventListener('pointerdown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
  window.addEventListener('pointermove', (e) => { if (!isDragging) return; offsetX += e.clientX - lastX; offsetY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; drawGraph(); });
  window.addEventListener('pointerup', () => isDragging = false);
  window.addEventListener('pointercancel', () => isDragging = false);
  window.addEventListener('resize', init);

  setTimeout(init, 50);
</script>

</body>
</html>
